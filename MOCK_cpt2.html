<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Time Calculator</title>
  <style>

    body {
      font-family: Arial, sans serif;
      padding: 30px;
      background-color: #ffffff;
    }

    .container {
      max-width: 450px;
      background: white;
      padding: 25px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: #d0e1fd;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #b5ccdc;
    }

    .reset-btn {
      background-color: #ffcccc;
    }

    .reset-btn:hover {
      background-color: #ffb3b3;
    }

    /* visual bar */
    .bar-container {
      display: flex;
      width: 100%;
      height: 50px;
      margin-top: 25px;
      background-color: #d0e1fd;
      overflow: hidden;
    }

    /* indiviual task boxes */
    .task-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-sizing: border-box;
      white-space: nowrap;
      padding: 0px;
    }

    .free-bar {
      flex-grow: 1;
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      white-space: nowrap;
    }
    
    .limit-warning {
      margin-top: 15px;
      padding: 10px;
      background-color: #ffdddd;
      color: #e20707;
      text-align: center;
      border-radius: 4px;
    }
  </style>

</head>
<body>

  <div class="container">

    <div class="input-group">
      <label>Time avalible (minutes):</label>
      <input type="number" id="availInput" placeholder="Input here:">
    </div>

    <div class="input-group">
      <label>Activity duration (minutes):</label>
      <input type="number" id="actInput" placeholder="Input here:">
    </div>

    <div class="button-row">
      <button onclick="testBarMove()">Add new activity</button>
      <button class="reset-btn" onclick="resetBar()">Reset</button>
    </div>

  </div>

  <div class="bar-container">

    <div class="task-segment" id="usedBar" style="width: 0%; background-color: #ffff00;">
      <span id="usedText" style="display: none;">Used time</span>
    </div>

    <div class="free-bar" id="free-bar">
      <span id="freeText">Free time</span>
    </div>

  </div>

  <script>
    var activityList = [];
    var currentWidth = 0;
    var slideTimer;

    function testBarMove() {
      var avail = Number(document.getElementById("availInput").value);
      var act = Number(document.getElementById("actInput").value);

      if (avail <= 0 || act <= 0) {
        return;
      }

      var totalUsed = 0;
      for (var i = 0; i < activityList.length; i = i + 1) {
        totalUsed = totalUsed + activityList[i];
      }

      var targetWidth;
      if (totalUsed + act > avail) {
        flashRed();
        targetWidth = 100;
      } else {
        activityList.push(act);
        totalUsed = totalUsed + act;
        targetWidth = (totalUsed / avail) * 100;
      }

      clearInterval(slideTimer);
      slideTimer = setInterval(function() {
        if (currentWidth < targetWidth) {
          currentWidth = currentWidth + 0.5;
          if (currentWidth > targetWidth) {
            currentWidth = targetWidth;
          }
          document.getElementById("usedBar").style.width = currentWidth + "%";
          updateLabels();
        } else {
          clearInterval(slideTimer);
        }
      }, 10);
    }

      // AI assisted
    function resetBar() {
      activityList = [];
      currentWidth = 0;
      document.getElementById("usedBar").style.width = "0%";
      document.getElementById("actInput").value = "";
      updateLabels();
    }
      // AI assisted

    //researched how to add a red flash
    function flashRed() {
      document.getElementById("usedBar").style.backgroundColor = "#ff0000";
      setTimeout(function() {
        document.getElementById("usedBar").style.backgroundColor = "#ffff00";
      }, 300);
    }

    function updateLabels() {
      var freeWidth = 100 - currentWidth;

      // hide text used time if under 10%
      var usedBar = document.getElementById("usedBar");
      var usedText = document.getElementById("usedText");
      if (currentWidth <= 0) {
        usedText.style.display = "none";
      } else {
        usedText.style.display = "inline-block";
        var usedScale = usedBar.offsetWidth / usedText.offsetWidth;
        var usedScaleY = usedBar.offsetHeight / usedText.offsetHeight;
        usedText.style.transform = "scale(" + usedScale + ", " + usedScaleY + ")";
      }

      // hide text free time if under 10%
      var freeBar = document.getElementById("free-bar");
      var freeText = document.getElementById("freeText");
      if (freeWidth <= 0) {
        freeText.style.display = "none";
      } else {
        freeText.style.display = "inline-block";
        var freeScale = freeBar.offsetWidth / freeText.offsetWidth;
        var freeScaleY = freeBar.offsetHeight / freeText.offsetHeight;
        freeText.style.transform = "scale(" + freeScale + ", " + freeScaleY + ")";
      }
    }
    
  </script>
</body>
</html>
